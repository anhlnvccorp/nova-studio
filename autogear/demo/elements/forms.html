<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forms — Flatsome element (tĩnh)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/elements/forms.css" />
  <style>.demo-note{background:#fff8e6;border-bottom:1px solid #f0dfae;padding:10px 15px;font-size:13px;text-align:center}.el-h{font-size:15px;font-weight:700;margin:22px 0 10px}</style>
</head>
<body>
  <script src="../assets/js/site-nav.js"></script>
  <div class="demo-note">Element <b>Forms</b> — Flatsome: Fluent Forms (demo submit giả). <a href="../elements.html">&larr; elements</a></div>
  <!-- PORT: Fluent Forms shortcode [fluentform id=".."] -->
  <div class="container" style="padding:30px 15px">
    <div class="el-h">Form liên hệ</div>
    <form class="el-form" data-el-form><label>Họ tên<input required placeholder="Nguyễn Văn A" /></label><label>Email<input type="email" required placeholder="ban@example.com" /></label><label>Dịch vụ<select><option>Gia công</option><option>Bảo trì</option><option>Tư vấn</option></select></label><label>Nội dung<textarea placeholder="Mô tả nhu cầu..."></textarea></label><button class="btn" type="submit">Gửi liên hệ</button></form>
    <div class="el-h">Form newsletter inline</div>
    <form class="el-form" data-el-form><label>Email<input type="email" required placeholder="ban@example.com" /></label><button class="btn" type="submit">Đăng ký</button></form>
  </div>
  <script src="../assets/js/elements.js"></script>
</body>
</html>
