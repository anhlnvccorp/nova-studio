<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hotspot — Flatsome element (tĩnh)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/elements/hotspot.css" />
  <style>.demo-note{background:#fff8e6;border-bottom:1px solid #f0dfae;padding:10px 15px;font-size:13px;text-align:center}</style>
</head>
<body>
  <script src="../assets/js/site-nav.js"></script>
  <div class="demo-note">Element <b>Hotspot</b> — Flatsome: <code>[ux_hotspot]</code> (bấm điểm trên ảnh). <a href="../elements.html">&larr; elements</a></div>
  <!-- PORT: [ux_hotspot img="..." pos="30 40"]... -->
  <div class="container" style="padding:30px 15px">
    <div class="el-hotspot" data-el-hotspot>
      <div class="ph">Ảnh xe — bấm các điểm 1/2/3</div>
      <button class="el-pin" style="left:30%;top:40%" data-tip="t1" aria-label="Điểm 1: Má phanh">1</button>
      <button class="el-pin" style="left:62%;top:65%" data-tip="t2" aria-label="Điểm 2: Lốp Michelin">2</button>
      <button class="el-pin" style="left:80%;top:30%" data-tip="t3" aria-label="Điểm 3: Đèn LED">3</button>
      <div class="el-tip" id="t1" style="left:30%;top:40%"><strong>Má phanh</strong>Brembo — $70.00</div>
      <div class="el-tip" id="t2" style="left:62%;top:65%"><strong>Lốp Michelin</strong>$100.00</div>
      <div class="el-tip" id="t3" style="left:80%;top:30%"><strong>Đèn LED</strong>$50.00</div>
    </div>
  </div>
  <script src="../assets/js/elements.js"></script>
</body>
</html>
