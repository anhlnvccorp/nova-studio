<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Video Button — Flatsome element (tĩnh)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/elements/video-button.css" />

<body>
  <script src="../assets/js/site-nav.js"></script>
  <div class="demo-note">Element <b>Video Button</b> — Flatsome: <code>[ux_video_button]</code> (bấm nút play). <a href="../elements.html">&larr; elements</a></div>
  <!-- PORT: [ux_video_button url="...youtube..."] -->
  <div class="container" style="padding:30px 15px;max-width:900px">
    <button class="el-vbtn" data-el-lightbox data-video="https://www.youtube.com/embed/dQw4w9WgXcQ" aria-label="Play video"><span class="el-vbtn__play">▶</span></button>
  </div>
  <script src="../assets/js/elements.js"></script>
