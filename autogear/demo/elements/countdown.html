<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Countdown — Flatsome element (tĩnh)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/autogear/demo/assets/css/base.css" />
  <link rel="stylesheet" href="/autogear/demo/assets/css/elements/countdown.css" />
  <style>.demo-note{background:#fff8e6;border-bottom:1px solid #f0dfae;padding:10px 15px;font-size:13px;text-align:center}.el-h{font-size:15px;font-weight:700;margin:22px 0 10px}</style>
</head>
<body>
  <script src="/autogear/demo/assets/js/site-nav.js"></script>
  <div class="demo-note">Element <b>Countdown</b> — Flatsome: <code>[ux_countdown]</code>. <a href="/autogear/demo/elements.html">&larr; elements</a></div>
  <!-- PORT: [ux_countdown date="2026/12/31"] (data-end để trống = hết hôm nay) -->
  <div class="container" style="padding:30px 15px">
    <div class="el-h">Kiểu tối (mặc định)</div>
    <div class="el-cd" data-el-countdown><div><strong data-d>00</strong><small>Days</small></div><div><strong data-h>00</strong><small>Hours</small></div><div><strong data-m>00</strong><small>Mins</small></div><div><strong data-s>00</strong><small>Secs</small></div></div>
    <div class="el-h">Kiểu primary</div>
    <div class="el-cd el-cd--primary" data-el-countdown data-end="2026-12-31T23:59:59"><div><strong data-d>00</strong><small>Days</small></div><div><strong data-h>00</strong><small>Hours</small></div><div><strong data-m>00</strong><small>Mins</small></div><div><strong data-s>00</strong><small>Secs</small></div></div>
  </div>
  <script src="/autogear/demo/assets/js/elements.js"></script>
</body>
</html>
