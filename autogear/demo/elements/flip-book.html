<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flip Book — custom element (tĩnh)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/elements/flip-book.css" />
  <style>.demo-note{background:#fff8e6;border-bottom:1px solid #f0dfae;padding:10px 15px;font-size:13px;text-align:center}</style>
</head>
<body>
  <script src="../assets/js/site-nav.js"></script>
  <div class="demo-note">Element <b>Flip Book</b> — custom JS lật sách 3D (Flatsome không có sẵn). <a href="../elements.html">&larr; elements</a></div>
  <!-- PORT: custom block — copy markup + flip-book.css + data-el-flip trong elements.js -->
  <div class="container" style="padding:30px 15px">
    <div class="el-book" data-el-flip>
      <div class="el-pages3d">
        <div class="el-page">1</div><div class="el-page">2</div><div class="el-page">3</div><div class="el-page">4</div>
      </div>
    </div>
    <div class="el-book__nav"><button class="btn" data-flip-prev>‹ Trước</button><button class="btn" data-flip-next>Sau ›</button></div>
  </div>
  <script src="../assets/js/elements.js"></script>
</body>
</html>
