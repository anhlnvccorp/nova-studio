<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />

<body>
  <script src="/autogear/demo/assets/js/site-nav.js"></script>
  <div class="demo-note">Element <b>Portfolio</b> — Flatsome: <code>[ux_portfolio]</code> (bấm nút để lọc). <a href="/autogear/demo/elements.html">&larr; elements</a></div>
  <!-- PORT: [ux_portfolio filter="true" columns="3"] -->
  <div class="container" style="padding:30px 15px">

    </div>
  </div>
  <script src="/autogear/demo/assets/js/elements.js"></script>
