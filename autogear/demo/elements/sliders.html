<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sliders — Flatsome element (tĩnh)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/elements/sliders.css" />
  <style>.demo-note{background:#fff8e6;border-bottom:1px solid #f0dfae;padding:10px 15px;font-size:13px;text-align:center}.el-h{font-size:15px;font-weight:700;margin:26px 0 10px}</style>
</head>
<body>
  <script src="../assets/js/site-nav.js"></script>
  <div class="demo-note">Element <b>Sliders</b> — Flatsome: <code>[ux_slider]</code>. <a href="../elements.html">&larr; elements</a></div>
  <!-- PORT: [ux_slider arrows="true" bullets="true" auto_slide="5000"] [ux_banner]... -->
  <div class="container" style="padding:30px 15px">
    <div class="el-h">Arrows + dots + autoplay 4s</div>
    <div class="el-slider" data-el-slider data-auto="4000">
      <div class="sw-circle-prg">
        <svg class="progress-svg" viewBox="0 0 48 48">
          <circle class="progress-bg" cx="24" cy="24" r="22"></circle>
          <circle class="progress-bar" cx="24" cy="24" r="22"></circle>
        </svg>
        <span class="pagination-number">1</span>
      </div>
      <div class="el-slide active" style="background:linear-gradient(120deg,#1a1d23,#4a4f5c)">Slide 1</div>
      <div class="el-slide" style="background:linear-gradient(120deg,#3a2c1a,#e63312)">Slide 2</div>
      <div class="el-slide" style="background:linear-gradient(120deg,#12303a,#1a9e4b)">Slide 3</div>
      <button class="el-arrow el-prev" aria-label="Trước">‹</button>
      <button class="el-arrow el-next" aria-label="Sau">›</button>
      <div class="el-dots"></div>
    </div>
    <div class="el-h">Dots only, không autoplay</div>
    <div class="el-slider" data-el-slider data-auto="0">
      <div class="el-slide active" style="background:linear-gradient(120deg,#4a2c3a,#d6336c)">A</div>
      <div class="el-slide" style="background:linear-gradient(120deg,#2c3a4a,#0693e3)">B</div>
      <div class="el-dots"></div>
    </div>
  </div>
  <script src="../assets/js/elements.js"></script>
</body>
</html>
