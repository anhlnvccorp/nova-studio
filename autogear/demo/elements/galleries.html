<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Galleries — Flatsome element (tĩnh)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/autogear/demo/assets/css/base.css" />
  <link rel="stylesheet" href="/autogear/demo/assets/css/elements/galleries.css" />
  <link rel="stylesheet" href="/autogear/demo/assets/css/elements/lightbox.css" />
  <style>.demo-note{background:#fff8e6;border-bottom:1px solid #f0dfae;padding:10px 15px;font-size:13px;text-align:center}.el-h{font-size:15px;font-weight:700;margin:22px 0 10px}</style>
</head>
<body>
  <script src="/autogear/demo/assets/js/site-nav.js"></script>
  <div class="demo-note">Element <b>Galleries</b> — Flatsome: <code>[ux_gallery]</code> (bấm ảnh để xem lightbox). <a href="/autogear/demo/elements.html">&larr; elements</a></div>
  <!-- PORT: [ux_gallery columns="4" lightbox="true"] -->
  <div class="container" style="padding:30px 15px">
    <div class="el-h">Grid 4 cột</div>
    <div class="el-gal">
      <div class="ph" data-el-lightbox data-full="Ảnh 1">1</div><div class="ph" data-el-lightbox data-full="Ảnh 2">2</div><div class="ph" data-el-lightbox data-full="Ảnh 3">3</div><div class="ph" data-el-lightbox data-full="Ảnh 4">4</div>
      <div class="ph" data-el-lightbox data-full="Ảnh 5">5</div><div class="ph" data-el-lightbox data-full="Ảnh 6">6</div><div class="ph" data-el-lightbox data-full="Ảnh 7">7</div><div class="ph" data-el-lightbox data-full="Ảnh 8">8</div>
    </div>
    <div class="el-h">Masonry 3 cột</div>
    <div class="el-gal el-gal--masonry">
      <div class="ph" data-el-lightbox data-full="M1">M1</div><div class="ph" data-el-lightbox data-full="M2">M2</div><div class="ph" data-el-lightbox data-full="M3">M3</div>
      <div class="ph" data-el-lightbox data-full="M4">M4</div><div class="ph" data-el-lightbox data-full="M5">M5</div><div class="ph" data-el-lightbox data-full="M6">M6</div>
    </div>
  </div>
  <script src="/autogear/demo/assets/js/elements.js"></script>
</body>
</html>
