<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Message box — Flatsome element (tĩnh)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/autogear/demo/assets/css/base.css" />
  <link rel="stylesheet" href="/autogear/demo/assets/css/elements/message-box.css" />
  <style>.demo-note{background:#fff8e6;border-bottom:1px solid #f0dfae;padding:10px 15px;font-size:13px;text-align:center}</style>
</head>
<body>
  <script src="/autogear/demo/assets/js/site-nav.js"></script>
  <div class="demo-note">Element <b>Message box</b> — Flatsome: <code>[message_box]</code>. <a href="/autogear/demo/elements.html">&larr; elements</a></div>
  <!-- PORT: [message_box bg="success"]... -->
  <div class="container" style="padding:30px 15px;max-width:800px">
    <div class="el-msg el-msg--success">✓ <strong>Thành công!</strong> Đơn hàng của bạn đã được ghi nhận.</div>
    <div class="el-msg el-msg--info">ℹ <strong>Thông tin:</strong> Miễn phí vận chuyển cho đơn trên $100.</div>
    <div class="el-msg el-msg--warning">⚠ <strong>Lưu ý:</strong> Sản phẩm sắp hết hàng.</div>
    <div class="el-msg el-msg--error">✕ <strong>Lỗi:</strong> Vui lòng kiểm tra lại email.</div>
  </div>
</body>
</html>
